name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: nvda-forecasting
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ tests
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff moto
          
      - name: Lint
        run: ruff check src api tests

      - name: Unit and integration tests
        run: pytest tests -v --cov=src --cov=api --cov-report=term-missing

      # Smoke-train on the cached snapshot: catches pipeline breakage without
      # paying for a full LSTM/Prophet run on every push.
      - name: Smoke-train pipeline
        run: python -m src.train --fast

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ github.sha }}
          path: |
            reports/metrics.csv
            reports/figures/

  # ---------------------------------------------------------------- quality
  model-quality-gate:
    name: Model quality gate
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Train and enforce thresholds
        run: |
          python -m src.train --fast
          python - <<'PY'
          import sys, pandas as pd
          m = pd.read_csv("reports/metrics.csv")
          best = m.sort_values("rmse").iloc[0]
          naive = m.loc[m.model == "naive", "rmse"].iloc[0]
          print(m.to_string(index=False))
          # A regression gate, not a "must beat the market" gate: block the
          # deploy if the champion is materially worse than the random walk.
          if best["rmse"] > naive * 1.05:
              sys.exit(f"FAIL: best RMSE {best['rmse']:.3f} > 1.05 x naive {naive:.3f}")
          if best["mape"] > 5.0:
              sys.exit(f"FAIL: best MAPE {best['mape']:.2f}% exceeds 5%")
          print(f"PASS: champion={best['model']} rmse={best['rmse']:.3f}")
          PY

  # ----------------------------------------------------------------- build
  build-and-push:
    name: Build image and push to ECR
    needs: [test, model-quality-gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write        # OIDC — no long-lived AWS keys in GitHub
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "0"        # report only; flip to 1 to block on findings

  # ---------------------------------------------------------------- deploy
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # SSM instead of SSH: no inbound port 22, no key material in CI.
      - name: Rolling restart via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ needs.build-and-push.outputs.image_tag }}" \
            --parameters commands='[
              "set -euo pipefail",
              "cd /opt/nvda-forecasting",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}",
              "docker compose -f deploy/docker-compose.yml pull",
              "docker compose -f deploy/docker-compose.yml up -d --remove-orphans",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Post-deploy health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ secrets.PUBLIC_URL }}/health" | tee /dev/stderr | grep -q '"status":"ok"'; then
              echo "Healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 10
          done
          echo "Health check failed — investigate before the next deploy"; exit 1
