# Reverse proxy for the NVDA forecasting stack.
#   /        -> nvda-api:8000     (FastAPI)
#   /mlflow/ -> nvda-mlflow:5002  (MLflow UI + registry)

upstream nvda_api    { server nvda-api:8000    max_fails=3 fail_timeout=20s; }
upstream nvda_mlflow { server nvda-mlflow:5002 max_fails=3 fail_timeout=20s; }

# Basic abuse protection on the inference endpoint.
limit_req_zone $binary_remote_addr zone=forecast_zone:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # Uncomment once certificates are in place to force TLS.
    # return 301 https://$host$request_uri;

    client_max_body_size 8m;

    # --- security headers -------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header X-XSS-Protection          "1; mode=block"  always;

    # --- FastAPI ----------------------------------------------------------
    location / {
        proxy_pass         http://nvda_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location /forecast {
        limit_req zone=forecast_zone burst=10 nodelay;
        proxy_pass         http://nvda_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check must never be rate limited or logged.
    location = /health {
        access_log off;
        proxy_pass http://nvda_api;
    }

    # Scrape endpoint: keep it off the public internet.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny  all;
        proxy_pass http://nvda_api;
    }

    # --- MLflow UI --------------------------------------------------------
    location /mlflow/ {
        # Restrict to the VPC / office range in production; the registry is
        # not something to expose publicly.
        # allow 10.0.0.0/8; deny all;

        proxy_pass         http://nvda_mlflow/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

